[workspace]
resolver = "2"
members = [
    "crates/aienos-capability",
    "crates/aienos-capability-ffi",
    "crates/aienos-kernel",
    "crates/aienos-agent-state",
    "crates/aienos-cortex",
    "crates/aienos-aegis",
    "crates/aienos-c1-tree",
    "crates/aienos-boot",
    "crates/aienos-accel",
    "crates/aienos-crypto",
    "crates/aienos-artifact",
    "crates/aienos-anchor",
    "crates/aienos-artifact-tool",
    "crates/aienos-evidence",
    "crates/aienos-store-tool",
    "crates/aienos-explain",
    "crates/aienos-infer",
    "crates/allen-reflex",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AIENOS Sovereign Contributors"]
license = "Apache-2.0"
repository = "https://github.com/aien-dev/aienux"

[workspace.dependencies]
aienos-crypto = { path = "crates/aienos-crypto" }
aienos-artifact = { path = "crates/aienos-artifact" }
aienos-artifact-tool = { path = "crates/aienos-artifact-tool" }
aienos-kernel = { path = "crates/aienos-kernel" }
aienos-agent-state = { path = "crates/aienos-agent-state" }
aienos-cortex = { path = "crates/aienos-cortex" }
aienos-aegis = { path = "crates/aienos-aegis" }
aienos-c1-tree = { path = "crates/aienos-c1-tree" }
aienos-accel = { path = "crates/aienos-accel" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# aienos-infer's forward tests run a real Llama-3.2-1B forward pass whenever the model
# file is present (it is on the Spark). Unoptimized, `cargo test --workspace` in
# scripts/verify_all.sh spent over an hour there and AIENOS-VERIFY-ALL hit its timeout.
# Optimizing only this crate keeps every test running (debug assertions and overflow
# checks stay on) and makes the gate finish.
[profile.dev.package.aienos-infer]
opt-level = 3
